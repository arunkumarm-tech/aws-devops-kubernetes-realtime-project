apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: arun-eks-cluster
  region: us-east-1
  version: "1.35"

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: false

managedNodeGroups:
  - name: arun-eks-ng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeType: gp3
    volumeSize: 20
    privateNetworking: false
